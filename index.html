<!doctype html>
<html lang="ru" translate="no">
  <head>
    <!--
      Исходная точка входа Vite (НЕ собранный файл!).
      Собранные варианты создаёт `npm run build` (dist/) и `npm run build:yandex`
      (publish/*.zip). Здесь правим разметку, у которой есть ровно одна обязанность
      для модерации — подключение SDK Яндекс Игр (п. 1.1 / 1.19.1).
    -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Перекуп BMW — кликер-симулятор перекупщика: пройди всю историю BMW от Dixi 1928 года до Neue Klasse." />
    <meta name="theme-color" content="#07090d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Браузерный автоперевод внутри iframe портит вёрстку и ломает локализацию игры. -->
    <meta name="google" content="notranslate" />
    <title>Перекуп BMW</title>

    <!-- Yandex Games SDK (п. 1.1, 1.19.1)
      Путь именно относительный: /sdk.js — так SDK подключается для игры,
      загруженной архивом на сервер платформы. Старый лоадер SDK (путь вида
      /games/sdk/v2) платформа считает устаревшим: на debug-панели горит IF
      вместо IT, а это отказ по п. 1.1.
      Скрипт обязан стоять в head ДО бандла: YaGames.init() вызывается из него
      (модуль game/yandex), иначе — «YaGames is not defined».
      Относительный путь — ЕДИНСТВЕННЫЙ источник SDK в релизе. Абсолютного
      адреса SDK в сборке нет намеренно: автопроверка Консоли считает такой
      домен ссылкой на внутреннее хранилище сервиса и отклоняет релиз
      («Обнаружена ссылка на сервисное хранилище»). Нужен SDK на своём домене —
      собирается отдельный вариант с переменной VITE_YANDEX_SDK_URL, в Консоль
      он не грузится.
      Сборка дополнительно вырезает из dist все HTML-комментарии
      (stripExternalRefs в конфигурации Vite): заметки разработчика не должны
      попадать в релизный файл, именно через них сюда уже дважды приезжали
      посторонние адреса.
      При сборке ПК-версии (npm run build:pc) этот блок вырезается. -->
    <script src="/sdk.js"></script>

    <style>
      /* Заглушка загрузки — показывается до готовности React-приложения */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #07090d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07090d;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #eef2f8;
        z-index: 999;
        transition: opacity 0.4s ease;
      }
      #boot .ring {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #1c69d4;
        animation: spin 0.9s linear infinite;
        margin: 0 auto 16px;
      }
      #boot .t {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.45);
        text-align: center;
        padding: 0 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div><div class="ring"></div><div class="t">Прогреваем мотор</div></div></div>

    <script>
      /**
       * П. 2.14 — язык загрузочного экрана до инициализации SDK.
       * Классический инлайн-скрипт выполняется раньше модуля игры (module —
       * deferred), поэтому первые кадры уже показываются на нужном языке:
       * 1) язык, выбранный игроком вручную (п. 6.9) — из локального сейва;
       * 2) иначе язык браузера (резервный набор: ru для ru/be/kk/uk/uz, en — для всех);
       * 3) как только SDK вернёт environment.i18n.lang, язык пересчитывается
       *    в src/main.tsx → applyBootLang() (это и есть автоопределение).
       * Строки здесь — короткая копия meta.* из src/i18n/*: синхронизировать
       * нужно только её, остальной текст игры переводит React.
       */
      (function () {
        var TEXTS = {
          ru: {
            title: "Перекуп BMW",
            boot: "Прогреваем мотор",
            desc: "Перекуп BMW — кликер-симулятор перекупщика: пройди всю историю BMW от Dixi 1928 года до Neue Klasse.",
          },
          en: {
            title: "BMW Reseller",
            boot: "Warming up the engine",
            desc: "BMW Reseller — a flipper clicker sim: play through the whole BMW history, from the 1928 Dixi to the Neue Klasse.",
          },
        };
        var RU_GROUP = ["ru", "be", "kk", "uk", "uz"];
        var SAVE_KEY = "bmw-perekup-save-v1";
        var d = document;
        var lang = null;

        try {
          var saved = window.localStorage.getItem(SAVE_KEY);
          saved = saved ? JSON.parse(saved) : null;
          // Только ручной выбор: автосохранённое значение языка не должно
          // переживать смену языка платформы — его пересчитывает SDK.
          if (saved && TEXTS[saved.lang] && typeof saved.langPinnedOn === "string") lang = saved.lang;
        } catch (e) {
          /* localStorage недоступен (изолированный sandbox) — не страшно */
        }

        if (!lang) {
          var nav = "";
          try {
            nav = String((navigator && (navigator.language || (navigator.languages || [])[0])) || "");
          } catch (e) {
            nav = "";
          }
          var code = nav.toLowerCase().split(/[-_]/)[0];
          lang = !code ? "ru" : RU_GROUP.indexOf(code) >= 0 ? "ru" : "en";
        }

        var t = TEXTS[lang];
        d.documentElement.lang = lang;
        d.title = t.title;
        var meta = d.querySelector('meta[name="description"]');
        if (meta) meta.setAttribute("content", t.desc);
        var boot = d.querySelector("#boot .t");
        if (boot) boot.textContent = t.boot;
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
