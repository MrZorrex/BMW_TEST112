name: Build Yandex Games release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/**"

permissions:
  contents: write

concurrency:
  group: yandex-release
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # Единая точка правды: ровно та же команда, что и локально.
      # Внутри неё: vite build → validate-yandex (исходник + dist) →
      # smoke-yandex-sdk (реальные вызовы SDK в собранном файле) → pack → проверка zip.
      # Раньше здесь был только grep картинок, и сборка БЕЗ тега SDK
      # (п. 1.1 — «SDK не встроено») ушла в Release незамеченной.
      - name: Build, validate and pack the Yandex package
        run: npm run build:yandex

      - name: Build and pack the offline PC version
        run: |
          npm run build:pc
          node scripts/pack.mjs --from pc-build --name bmw-clicker-pc.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bmw-clicker-builds
          path: |
            publish/bmw-clicker-yandex.zip
            publish/bmw-clicker-pc.zip
          if-no-files-found: error

      - name: Move latest-build tag
        run: |
          git tag -f latest-build "$GITHUB_SHA"
          git push origin refs/tags/latest-build --force

      - name: Publish permanent download release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          NOTES="Автоматическая актуальная сборка ветки $GITHUB_REF_NAME. Для Консоли Яндекс Игр скачайте bmw-clicker-yandex.zip (грузится целиком, распаковывать не нужно; index.html уже в корне архива — п. 1.22). bmw-clicker-pc.zip — автономная версия для ПК БЕЗ SDK: в Консоль её загружать нельзя (отказ по п. 1.1)."
          if gh release view latest-build >/dev/null 2>&1; then
            gh release upload latest-build publish/bmw-clicker-yandex.zip publish/bmw-clicker-pc.zip --clobber
            gh release edit latest-build --title "Перекуп BMW — сборка для Яндекс Игр" --notes "$NOTES" --latest
          else
            gh release create latest-build publish/bmw-clicker-yandex.zip publish/bmw-clicker-pc.zip --title "Перекуп BMW — сборка для Яндекс Игр" --notes "$NOTES" --latest
          fi
